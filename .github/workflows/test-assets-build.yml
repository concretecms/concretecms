name: Test assets build

# Unlike build-assets.yml this never commits nor opens pull requests: it only checks that
# the assets can be built with the exact dependencies of build/package-lock.json.
# No path filters, so that it can be a required check (Dependabot pull requests included).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-assets-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-assets-build:
    name: Test assets build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          # Keep aligned with build-assets.yml
          node-version: 18
      - name: Install NodeJS dependencies
        working-directory: build
        run: npm ci --no-audit --no-fund
      - name: Build assets
        working-directory: build
        run: npm run-script production
